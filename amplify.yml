version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify only exposes console env vars to the SSR runtime when they are written to .env.production at build time.
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_SERVICE_ROLE_KEY|SITE_ALLOW_INDEXING|VAPID_PRIVATE_KEY|VAPID_SUBJECT|PUSH_DISPATCH_SECRET|IBBA_SYNC_URL)' >> .env.production || true
        - if [ -z "$IBBA_SYNC_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "IBBA_SYNC_URL=${NEXT_PUBLIC_SUPABASE_URL%/}/functions/v1/ibba-sync" >> .env.production; fi
        # Without a public site URL, QR codes, share previews and calendar links point at localhost. Default to the branch domain.
        - if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then echo "NEXT_PUBLIC_SITE_URL=https://${AWS_BRANCH}.${AWS_APP_ID}.amplifyapp.com" >> .env.production; fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*

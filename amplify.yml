version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify only exposes console env vars to the SSR runtime when they are written to .env.production at build time.
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_SERVICE_ROLE_KEY|SITE_ALLOW_INDEXING|VAPID_PRIVATE_KEY|VAPID_SUBJECT|PUSH_DISPATCH_SECRET)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
